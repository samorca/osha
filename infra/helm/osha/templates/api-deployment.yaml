{{/*
=====================================================================
OSHA API Deployment
=====================================================================

Process:

    scripts/api/run.sh
        ->
    src.api.app

This workload serves HTTP traffic.

The orchestration runtime and workers are deployed
separately.
*/}}

{{- if .Values.api.enabled }}

{{- include "osha.api.validate" . }}

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "osha.api.fullname" . }}
  namespace: {{ include "osha.namespace" . }}

  labels:
    {{- include "osha.api.labels" . | nindent 4 }}

  annotations:
    osha.atonixcorp.io/description: >-
      OSHA HTTP API deployment.


spec:
  # -----------------------------------------------------------------
  # Replicas
  # -----------------------------------------------------------------

  replicas: {{ .Values.api.replicaCount }}


  # -----------------------------------------------------------------
  # Deployment history
  # -----------------------------------------------------------------

  revisionHistoryLimit: 5


  # -----------------------------------------------------------------
  # Selector
  # -----------------------------------------------------------------
  #
  # Selector labels intentionally contain only stable
  # identity fields.
  # -----------------------------------------------------------------

  selector:
    matchLabels:
      {{- include "osha.api.selectorLabels" . | nindent 6 }}


  # -----------------------------------------------------------------
  # Rolling updates
  # -----------------------------------------------------------------

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1


  # -----------------------------------------------------------------
  # Pod template
  # -----------------------------------------------------------------

  template:
    metadata:
      labels:
        {{- include "osha.api.labels" . | nindent 8 }}

      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}

      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}


    spec:
      # -------------------------------------------------------------
      # Kubernetes identity
      # -------------------------------------------------------------

      serviceAccountName: {{ include "osha.api.serviceAccountName" . }}

      automountServiceAccountToken: {{ .Values.serviceAccount.api.automountServiceAccountToken }}


      # -------------------------------------------------------------
      # Graceful termination
      # -------------------------------------------------------------

      terminationGracePeriodSeconds: {{ .Values.api.gracefulTimeoutSeconds | add 15 }}


      # -------------------------------------------------------------
      # Image pull credentials
      # -------------------------------------------------------------

      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}


      # -------------------------------------------------------------
      # Pod security
      # -------------------------------------------------------------

      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}


      # -------------------------------------------------------------
      # Scheduling
      # -------------------------------------------------------------

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}


      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}


      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}


      initContainers:
        {{- include "osha.modelSeedInitContainer" . | nindent 8 }}


      # -------------------------------------------------------------
      # Containers
      # -------------------------------------------------------------

      containers:
        - name: api

          image: {{ include "osha.image" . | quote }}

          imagePullPolicy: {{ .Values.global.image.pullPolicy }}


          # ---------------------------------------------------------
          # Entrypoint
          # ---------------------------------------------------------

          command:
            - /bin/bash
            - /app/scripts/api/run.sh


          workingDir: /app


          # ---------------------------------------------------------
          # Shared configuration
          # ---------------------------------------------------------

          envFrom:
            - configMapRef:
                name: {{ include "osha.configMapName" . }}


          # ---------------------------------------------------------
          # Kubernetes workload identity
          # ---------------------------------------------------------

          env:
            - name: OSHA_PROCESS_ROLE
              value: "api"

            - name: OSHA_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.passwordKey | quote }}

            - name: OSHA_KUBERNETES_NAMESPACE

              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace


            - name: OSHA_POD_NAME

              valueFrom:
                fieldRef:
                  fieldPath: metadata.name


            - name: OSHA_POD_UID

              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid


            - name: OSHA_NODE_NAME

              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName


            - name: OSHA_POD_IP

              valueFrom:
                fieldRef:
                  fieldPath: status.podIP


          # ---------------------------------------------------------
          # API port
          # ---------------------------------------------------------

          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP


          # ---------------------------------------------------------
          # Startup probe
          # ---------------------------------------------------------

          {{- if .Values.api.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.api.startupProbe.path }}
              port: http
              scheme: HTTP
              httpHeaders:
                - name: Host
                  value: localhost

            periodSeconds: {{ .Values.api.startupProbe.periodSeconds }}

            timeoutSeconds: {{ .Values.api.startupProbe.timeoutSeconds }}

            failureThreshold: {{ .Values.api.startupProbe.failureThreshold }}

            successThreshold: 1
          {{- end }}


          # ---------------------------------------------------------
          # Liveness probe
          # ---------------------------------------------------------

          {{- if .Values.api.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.livenessProbe.path }}
              port: http
              scheme: HTTP
              httpHeaders:
                - name: Host
                  value: localhost

            periodSeconds: {{ .Values.api.livenessProbe.periodSeconds }}

            timeoutSeconds: {{ .Values.api.livenessProbe.timeoutSeconds }}

            failureThreshold: {{ .Values.api.livenessProbe.failureThreshold }}

            successThreshold: 1
          {{- end }}


          # ---------------------------------------------------------
          # Readiness probe
          # ---------------------------------------------------------

          {{- if .Values.api.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.readinessProbe.path }}
              port: http
              scheme: HTTP
              httpHeaders:
                - name: Host
                  value: localhost

            periodSeconds: {{ .Values.api.readinessProbe.periodSeconds }}

            timeoutSeconds: {{ .Values.api.readinessProbe.timeoutSeconds }}

            failureThreshold: {{ .Values.api.readinessProbe.failureThreshold }}

            successThreshold: 1
          {{- end }}


          # ---------------------------------------------------------
          # Resources
          # ---------------------------------------------------------

          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}


          # ---------------------------------------------------------
          # Container security
          # ---------------------------------------------------------

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}


          # ---------------------------------------------------------
          # Writable paths
          # ---------------------------------------------------------
          #
          # Root filesystem stays read-only while
          # these directories remain writable.
          # ---------------------------------------------------------

          volumeMounts:
            - name: tmp
              mountPath: /tmp

            - name: runtime-tmp
              mountPath: /app/.runtime

            {{- include "osha.modelVolumeMount" . | nindent 12 }}

            {{- if .Values.persistence.enabled }}
            - name: osha-data
              mountPath: {{ .Values.paths.artifacts }}
              subPath: artifacts

            - name: osha-data
              mountPath: {{ .Values.paths.checkpoints }}
              subPath: checkpoints

            - name: osha-data
              mountPath: {{ .Values.paths.logs }}
              subPath: logs

            - name: osha-data
              mountPath: {{ .Values.paths.data }}
              subPath: dataset
            {{- else }}
            - name: framework-data
              mountPath: {{ .Values.paths.data }}
            {{- end }}


      # -------------------------------------------------------------
      # Volumes
      # -------------------------------------------------------------

      volumes:
        - name: tmp
          emptyDir: {}

        - name: runtime-tmp
          emptyDir: {}

        {{- include "osha.modelVolume" . | nindent 8 }}

        {{- if not .Values.persistence.enabled }}
        - name: framework-data
          emptyDir: {}
        {{- end }}

{{- end }}
