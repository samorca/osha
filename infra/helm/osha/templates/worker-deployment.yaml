{{- if .Values.worker.enabled }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "osha.fullname" . }}-worker
  labels:
    {{- include "osha.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker

spec:
  replicas: {{ .Values.worker.replicaCount }}

  selector:
    matchLabels:
      {{- include "osha.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker

  template:
    metadata:
      labels:
        {{- include "osha.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker

      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}

      {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}

    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      serviceAccountName: {{ include "osha.worker.serviceAccountName" . }}

      securityContext:
        {{- toYaml (.Values.worker.podSecurityContext | default .Values.podSecurityContext) | nindent 8 }}

      initContainers:
        {{- include "osha.modelSeedInitContainer" . | nindent 8 }}

      containers:
        - name: worker

          securityContext:
            {{- toYaml (.Values.worker.securityContext | default .Values.securityContext) | nindent 12 }}

          image: {{ include "osha.image" . | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}

          command:
            {{- toYaml .Values.worker.command | nindent 12 }}

          env:
            - name: OSHA_ENV
              value: {{ .Values.global.environment | default "production" | quote }}

            - name: PYTHONUNBUFFERED
              value: "1"

            - name: PYTHONPATH
              value: "/app"

            - name: OSHA_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.passwordKey | quote }}

            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          envFrom:
            - configMapRef:
                name: {{ include "osha.configMapName" . }}
            {{- with .Values.worker.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}

          {{- with .Values.worker.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.worker.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          volumeMounts:
            - name: tmp
              mountPath: /tmp

            {{- include "osha.modelVolumeMount" . | nindent 12 }}

            {{- with .Values.worker.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

            {{- if .Values.persistence.enabled }}
            - name: osha-data
              mountPath: {{ .Values.paths.artifacts }}
              subPath: artifacts
            {{- end }}

      volumes:
        - name: tmp
          emptyDir: {}

        {{- with .Values.worker.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

        {{- include "osha.modelVolume" . | nindent 8 }}

      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds | default 30 }}

{{- end }}