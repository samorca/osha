---
# ================================================================
# OSHA Helm defaults
# ================================================================


# ----------------------------------------------------------------
# Global
# ----------------------------------------------------------------

global:
  environment: kubernetes

  dryRun: true

  image:
    repository: osha
    tag: latest
    pullPolicy: IfNotPresent

  imagePullSecrets: []


# ----------------------------------------------------------------
# Shared OSHA runtime configuration
# ----------------------------------------------------------------

config:
  environmentId: kubernetes

  instanceName: osha

  failFast: true

  startupTimeoutSeconds: 60

  shutdownTimeoutSeconds: 60

  healthIntervalSeconds: 15

  runtimeLogLevel: info


# ----------------------------------------------------------------
# Remediation safety
# ----------------------------------------------------------------

remediation:
  enabled: true

  dryRun: true

  automaticExecution: false

  requireApproval: true

  allowDestructiveActions: false


# ----------------------------------------------------------------
# PostgreSQL persistence
# ----------------------------------------------------------------

database:
  backend: postgresql

  name: osha

  username: osha

  host: ""

  port: 5432

  existingSecret: osha-postgresql-credentials

  passwordKey: password

  postgresql:
    enabled: true

    image: postgres:16-alpine

    storage: 8Gi

    storageClassName: ""

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1
        memory: 1Gi


# ----------------------------------------------------------------
# Capacity forecasting
# ----------------------------------------------------------------

forecasting:
  enabled: true

  minimumPoints: 4

  trainingWindowHours: 24

  defaultHorizonHours: 12

  stepMinutes: 60


# ----------------------------------------------------------------
# API
# ----------------------------------------------------------------

api:
  enabled: true

  replicaCount: 1

  workers: 1

  host: "0.0.0.0"

  port: 8088

  logLevel: info

  gracefulTimeoutSeconds: 30

  limitConcurrency: 500

  limitMaxRequests: 10000

  forwardedAllowIPs: "127.0.0.1"


  service:
    type: ClusterIP

    port: 8088


  resources:
    requests:
      cpu: 250m
      memory: 256Mi

    limits:
      cpu: "2"
      memory: 2Gi


  startupProbe:
    enabled: true

    path: /health/live

    periodSeconds: 5

    timeoutSeconds: 3

    failureThreshold: 24


  livenessProbe:
    enabled: true

    path: /health/live

    periodSeconds: 15

    timeoutSeconds: 3

    failureThreshold: 3


  readinessProbe:
    enabled: true

    path: /health/ready

    periodSeconds: 10

    timeoutSeconds: 3

    failureThreshold: 3


# ----------------------------------------------------------------
# Runtime
# ----------------------------------------------------------------

runtime:
  enabled: true

  #
  # Keep the orchestration authority single-instance
  # until distributed coordination / leader election
  # is explicitly implemented.
  #
  replicaCount: 1

  startedBy: helm-runtime

  resources:
    requests:
      cpu: 250m
      memory: 256Mi

    limits:
      cpu: "2"
      memory: 2Gi


# ----------------------------------------------------------------
# Workers
# ----------------------------------------------------------------

worker:
  enabled: true

  replicaCount: 1

  command:
    - /bin/bash
    - /app/scripts/runtime/worker.sh
    - --worker
    - telemetry

  type: telemetry

  concurrency: 1

  pollIntervalSeconds: 2

  gracefulShutdownSeconds: 30

  modelFamilies:
    enabled: true

    event: true

    anomaly: true

    incidentRootCause: true

    decisionRisk: true

    remediationRanking: true

    capacityForecasting: true

  resources:
    requests:
      cpu: 250m
      memory: 256Mi

    limits:
      cpu: "2"
      memory: 2Gi


# ----------------------------------------------------------------
# Telemetry
# ----------------------------------------------------------------

telemetry:
  enabled: true

  intervalSeconds: 15


# ----------------------------------------------------------------
# Collectors
# ----------------------------------------------------------------

collectors:
  enabled: true

  intervalSeconds: 30


# ----------------------------------------------------------------
# Accelerator
# ----------------------------------------------------------------

accelerator:
  preferred: auto

  allowCPUFallback: true


# ----------------------------------------------------------------
# Storage paths
# ----------------------------------------------------------------
#
# These are container filesystem locations.
#
# Persistence is deliberately controlled separately
# rather than implied by these path definitions.
# ----------------------------------------------------------------

paths:
  artifacts: /app/artifacts

  aiCache: /tmp/osha/ai-cache

  checkpoints: /app/checkpoints

  models: /app/models

  aiLogs: /tmp/osha/ai-logs

  logs: /app/logs

  data: /app/orchestration-ai-data


# ----------------------------------------------------------------
# Persistence
# ----------------------------------------------------------------
#
# Disabled in the base chart until storage classes
# and ownership requirements are selected for each
# environment.
# ----------------------------------------------------------------

persistence:
  enabled: false

  storageClass: ""

  accessModes:
    - ReadWriteOnce

  size: 10Gi


# ----------------------------------------------------------------
# Unified model training
# ----------------------------------------------------------------

training:
  enabled: false

  version: ""

  dataRoot: /app/data

  eventData: /app/data/processed/logs/events.jsonl

  anomalyData: /app/data/processed/anomalies/records.jsonl

  capacityData: /app/data/processed/metrics/snapshots.jsonl

  epochs: 10

  batchSize: 64

  seed: 42

  numWorkers: 2

  accelerator: auto

  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi


# ----------------------------------------------------------------
# Service accounts
# ----------------------------------------------------------------

serviceAccount:
  api:
    create: true

    name: osha-api

    automountServiceAccountToken: false


  runtime:
    create: true

    name: osha-runtime

    automountServiceAccountToken: false


  worker:
    create: true

    name: osha-worker

    automountServiceAccountToken: false


# ----------------------------------------------------------------
# Pod security
# ----------------------------------------------------------------

podSecurityContext:
  runAsNonRoot: true

  runAsUser: 10001

  runAsGroup: 10001

  fsGroup: 10001

  seccompProfile:
    type: RuntimeDefault


securityContext:
  allowPrivilegeEscalation: false

  privileged: false

  readOnlyRootFilesystem: true

  capabilities:
    drop:
      - ALL


# ----------------------------------------------------------------
# Scheduling
# ----------------------------------------------------------------

nodeSelector: {}

tolerations: []

affinity: {}


# ----------------------------------------------------------------
# Additional labels
# ----------------------------------------------------------------

commonLabels: {}


# ----------------------------------------------------------------
# Additional annotations
# ----------------------------------------------------------------

podAnnotations: {}
