---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: osha-operator-role
rules:
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  - statefulsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - platform.osha.io
  resources:
  - oshaplatforms
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - platform.osha.io
  resources:
  - oshaplatforms/status
  verbs:
  - get
  - patch
  - update
