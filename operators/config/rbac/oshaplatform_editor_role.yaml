apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oshaplatform-editor-role
  labels:
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups:
      - platform.osha.io
    resources:
      - oshaplatforms
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  - apiGroups:
      - platform.osha.io
    resources:
      - oshaplatforms/status
    verbs:
      - get
