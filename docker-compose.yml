name: osha

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: "osha"
      POSTGRES_USER: "osha"
      POSTGRES_PASSWORD: ${OSHA_DATABASE_PASSWORD:?Set OSHA_DATABASE_PASSWORD before starting Compose}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - osha-postgres-data:/var/lib/postgresql/data

  model-seed:
    image: osha:latest
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    user: "10001:10001"
    working_dir: /app
    command:
      - /bin/bash
      - /app/scripts/models/seed_models.sh
    environment:
      OSHA_MODEL_SEED_DIRECTORY: /opt/osha/model-seed
      OSHA_AI_MODELS_DIRECTORY: /app/models
    restart: "no"
    volumes:
      - osha-models:/app/models

  api:
    image: osha:latest
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      model-seed:
        condition: service_completed_successfully
    user: "10001:10001"
    working_dir: /app
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
    command:
      - /bin/bash
      - /app/scripts/api/run.sh
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OSHA_PROCESS_ROLE: "api"
      OSHA_ENVIRONMENT_ID: "kubernetes"
      OSHA_DATABASE_BACKEND: "postgresql"
      OSHA_DATABASE_NAME: "osha"
      OSHA_DATABASE_ENVIRONMENT_ID: "kubernetes"
      OSHA_DATABASE_HOST: "postgres"
      OSHA_DATABASE_PORT: "5432"
      OSHA_DATABASE_USERNAME: "osha"
      OSHA_DATABASE_SECRET_PROVIDER: "environment"
      OSHA_DATABASE_SECRET_NAME: "database-password"
      OSHA_DATABASE_SECRET_KEY: "OSHA_DATABASE_PASSWORD"
      OSHA_DATABASE_PASSWORD: ${OSHA_DATABASE_PASSWORD:?Set OSHA_DATABASE_PASSWORD before starting Compose}
      OSHA_INSTANCE_NAME: "osha"
      OSHA_DRY_RUN: "true"
      OSHA_FAIL_FAST: "true"
      OSHA_STARTUP_TIMEOUT_SECONDS: "60"
      OSHA_SHUTDOWN_TIMEOUT_SECONDS: "60"
      OSHA_HEALTH_INTERVAL_SECONDS: "15"
      OSHA_RUNTIME_LOG_LEVEL: "info"
      OSHA_API_HOST: "0.0.0.0"
      OSHA_API_PORT: "8088"
      OSHA_API_WORKERS: "1"
      OSHA_API_LOG_LEVEL: "info"
      OSHA_API_GRACEFUL_TIMEOUT: "30"
      OSHA_API_LIMIT_CONCURRENCY: "500"
      OSHA_API_LIMIT_MAX_REQUESTS: "10000"
      OSHA_FORWARDED_ALLOW_IPS: "127.0.0.1"
      OSHA_ARTIFACTS_DIR: "/app/artifacts"
      OSHA_CHECKPOINTS_DIR: "/app/checkpoints"
      OSHA_MODELS_DIR: "/app/models"
      OSHA_AI_MODELS_DIRECTORY: "/app/models"
      OSHA_MODEL_FAMILIES_ENABLED: "true"
      OSHA_EVENT_MODEL_ENABLED: "true"
      OSHA_ANOMALY_MODEL_ENABLED: "true"
      OSHA_INCIDENT_ROOT_CAUSE_MODEL_ENABLED: "true"
      OSHA_DECISION_RISK_MODEL_ENABLED: "true"
      OSHA_REMEDIATION_RANKING_MODEL_ENABLED: "true"
      OSHA_CAPACITY_FORECASTING_MODEL_ENABLED: "true"
      OSHA_LOGS_DIR: "/app/logs"
      OSHA_DATA_DIR: "/app/data"
      OSHA_ACCELERATOR: "auto"
      OSHA_ALLOW_CPU_FALLBACK: "true"
      OSHA_REMEDIATION_ENABLED: "true"
      OSHA_REMEDIATION_DRY_RUN: "true"
      OSHA_REMEDIATION_AUTOMATIC_EXECUTION: "false"
      OSHA_REMEDIATION_REQUIRE_APPROVAL: "true"
      OSHA_REMEDIATION_ALLOW_DESTRUCTIVE_ACTIONS: "false"
      OSHA_OBSERVABILITY_ENABLED: "true"
      OSHA_METRICS_ENABLED: "true"
      OSHA_LOGGING_ENABLED: "true"
    ports:
      - "8088:8088"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error http://127.0.0.1:8088/health/live
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 120s
    volumes:
      - osha-artifacts:/app/artifacts
      - osha-checkpoints:/app/checkpoints
      - osha-models:/app/models:ro
      - osha-logs:/app/logs
      - osha-data:/app/data

  runtime:
    image: osha:latest
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      model-seed:
        condition: service_completed_successfully
    user: "10001:10001"
    working_dir: /app
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
    command:
      - /bin/bash
      - /app/scripts/runtime/run.sh
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OSHA_PROCESS_ROLE: "runtime"
      OSHA_ENVIRONMENT_ID: "kubernetes"
      OSHA_DATABASE_BACKEND: "postgresql"
      OSHA_DATABASE_NAME: "osha"
      OSHA_DATABASE_ENVIRONMENT_ID: "kubernetes"
      OSHA_DATABASE_HOST: "postgres"
      OSHA_DATABASE_PORT: "5432"
      OSHA_DATABASE_USERNAME: "osha"
      OSHA_DATABASE_SECRET_PROVIDER: "environment"
      OSHA_DATABASE_SECRET_NAME: "database-password"
      OSHA_DATABASE_SECRET_KEY: "OSHA_DATABASE_PASSWORD"
      OSHA_DATABASE_PASSWORD: ${OSHA_DATABASE_PASSWORD:?Set OSHA_DATABASE_PASSWORD before starting Compose}
      OSHA_INSTANCE_NAME: "osha"
      OSHA_DRY_RUN: "true"
      OSHA_FAIL_FAST: "true"
      OSHA_STARTUP_TIMEOUT_SECONDS: "60"
      OSHA_SHUTDOWN_TIMEOUT_SECONDS: "60"
      OSHA_HEALTH_INTERVAL_SECONDS: "15"
      OSHA_RUNTIME_LOG_LEVEL: "info"
      OSHA_ARTIFACTS_DIR: "/app/artifacts"
      OSHA_CHECKPOINTS_DIR: "/app/checkpoints"
      OSHA_MODELS_DIR: "/app/models"
      OSHA_AI_MODELS_DIRECTORY: "/app/models"
      OSHA_MODEL_FAMILIES_ENABLED: "true"
      OSHA_EVENT_MODEL_ENABLED: "true"
      OSHA_ANOMALY_MODEL_ENABLED: "true"
      OSHA_INCIDENT_ROOT_CAUSE_MODEL_ENABLED: "true"
      OSHA_DECISION_RISK_MODEL_ENABLED: "true"
      OSHA_REMEDIATION_RANKING_MODEL_ENABLED: "true"
      OSHA_CAPACITY_FORECASTING_MODEL_ENABLED: "true"
      OSHA_LOGS_DIR: "/app/logs"
      OSHA_DATA_DIR: "/app/data"
      OSHA_ACCELERATOR: "auto"
      OSHA_ALLOW_CPU_FALLBACK: "true"
      OSHA_TELEMETRY_ENABLED: "true"
      OSHA_TELEMETRY_INTERVAL_SECONDS: "15"
      OSHA_COLLECTORS_ENABLED: "true"
      OSHA_COLLECTOR_INTERVAL_SECONDS: "30"
      OSHA_WORKERS_ENABLED: "true"
      OSHA_WORKER_CONCURRENCY: "1"
      OSHA_WORKER_POLL_INTERVAL_SECONDS: "2"
      OSHA_WORKER_GRACEFUL_SHUTDOWN_SECONDS: "30"
      OSHA_REMEDIATION_ENABLED: "true"
      OSHA_REMEDIATION_DRY_RUN: "true"
      OSHA_REMEDIATION_AUTOMATIC_EXECUTION: "false"
      OSHA_REMEDIATION_REQUIRE_APPROVAL: "true"
      OSHA_REMEDIATION_ALLOW_DESTRUCTIVE_ACTIONS: "false"
      OSHA_OBSERVABILITY_ENABLED: "true"
      OSHA_METRICS_ENABLED: "true"
      OSHA_LOGGING_ENABLED: "true"
      OSHA_STARTED_BY: "compose-runtime"
    healthcheck:
      test:
        - CMD-SHELL
        - "kill -0 1"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 60s
    volumes:
      - osha-artifacts:/app/artifacts
      - osha-checkpoints:/app/checkpoints
      - osha-models:/app/models:ro
      - osha-logs:/app/logs
      - osha-data:/app/data

  worker:
    image: osha:latest
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      model-seed:
        condition: service_completed_successfully
    user: "10001:10001"
    working_dir: /app
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
    command:
      - /bin/bash
      - /app/scripts/runtime/worker.sh
      - --worker
      - telemetry
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OSHA_PROCESS_ROLE: "worker"
      OSHA_ENVIRONMENT_ID: "kubernetes"
      OSHA_DATABASE_BACKEND: "postgresql"
      OSHA_DATABASE_NAME: "osha"
      OSHA_DATABASE_ENVIRONMENT_ID: "kubernetes"
      OSHA_DATABASE_HOST: "postgres"
      OSHA_DATABASE_PORT: "5432"
      OSHA_DATABASE_USERNAME: "osha"
      OSHA_DATABASE_SECRET_PROVIDER: "environment"
      OSHA_DATABASE_SECRET_NAME: "database-password"
      OSHA_DATABASE_SECRET_KEY: "OSHA_DATABASE_PASSWORD"
      OSHA_DATABASE_PASSWORD: ${OSHA_DATABASE_PASSWORD:?Set OSHA_DATABASE_PASSWORD before starting Compose}
      OSHA_INSTANCE_NAME: "osha"
      OSHA_DRY_RUN: "true"
      OSHA_FAIL_FAST: "true"
      OSHA_STARTUP_TIMEOUT_SECONDS: "60"
      OSHA_SHUTDOWN_TIMEOUT_SECONDS: "60"
      OSHA_HEALTH_INTERVAL_SECONDS: "15"
      OSHA_RUNTIME_LOG_LEVEL: "info"
      OSHA_ARTIFACTS_DIR: "/app/artifacts"
      OSHA_CHECKPOINTS_DIR: "/app/checkpoints"
      OSHA_MODELS_DIR: "/app/models"
      OSHA_AI_MODELS_DIRECTORY: "/app/models"
      OSHA_MODEL_FAMILIES_ENABLED: "true"
      OSHA_EVENT_MODEL_ENABLED: "true"
      OSHA_ANOMALY_MODEL_ENABLED: "true"
      OSHA_INCIDENT_ROOT_CAUSE_MODEL_ENABLED: "true"
      OSHA_DECISION_RISK_MODEL_ENABLED: "true"
      OSHA_REMEDIATION_RANKING_MODEL_ENABLED: "true"
      OSHA_CAPACITY_FORECASTING_MODEL_ENABLED: "true"
      OSHA_LOGS_DIR: "/app/logs"
      OSHA_DATA_DIR: "/app/data"
      OSHA_ACCELERATOR: "auto"
      OSHA_ALLOW_CPU_FALLBACK: "true"
      OSHA_TELEMETRY_ENABLED: "true"
      OSHA_TELEMETRY_INTERVAL_SECONDS: "15"
      OSHA_COLLECTORS_ENABLED: "true"
      OSHA_COLLECTOR_INTERVAL_SECONDS: "30"
      OSHA_WORKERS_ENABLED: "true"
      OSHA_WORKER_CONCURRENCY: "1"
      OSHA_WORKER_POLL_INTERVAL_SECONDS: "2"
      OSHA_WORKER_GRACEFUL_SHUTDOWN_SECONDS: "30"
      OSHA_REMEDIATION_ENABLED: "true"
      OSHA_REMEDIATION_DRY_RUN: "true"
      OSHA_REMEDIATION_AUTOMATIC_EXECUTION: "false"
      OSHA_REMEDIATION_REQUIRE_APPROVAL: "true"
      OSHA_REMEDIATION_ALLOW_DESTRUCTIVE_ACTIONS: "false"
      OSHA_OBSERVABILITY_ENABLED: "true"
      OSHA_METRICS_ENABLED: "true"
      OSHA_LOGGING_ENABLED: "true"
      OSHA_WORKER_TYPE: "telemetry"
    healthcheck:
      test:
        - CMD-SHELL
        - "kill -0 1"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    volumes:
      - osha-artifacts:/app/artifacts
      - osha-checkpoints:/app/checkpoints
      - osha-models:/app/models:ro
      - osha-logs:/app/logs
      - osha-data:/app/data

  trainer:
    image: osha:latest
    profiles:
      - training
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    user: "10001:10001"
    working_dir: /app
    entrypoint:
      - python
      - -m
      - src.training.train_all
    depends_on:
      model-seed:
        condition: service_completed_successfully
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OSHA_AI_MODELS_DIRECTORY: "/app/models"
    volumes:
      - ./data:/app/data:ro
      - osha-artifacts:/app/artifacts
      - osha-checkpoints:/app/checkpoints
      - osha-models:/app/models
      - osha-logs:/app/logs

volumes:
  osha-postgres-data:
  osha-artifacts:
  osha-checkpoints:
  osha-models:
  osha-logs:
  osha-data: