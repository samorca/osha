apiVersion: apps/v1
kind: Deployment

metadata:
  name: controller-manager
  namespace: osha-lifecycle-system

spec:
  replicas: 1

  template:
    spec:
      containers:
        - name: manager
          imagePullPolicy: Never

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 500m
              memory: 256Mi
