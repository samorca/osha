apiVersion: apps/v1
kind: Deployment

metadata:
  name: controller-manager
  namespace: osha-lifecycle-system

spec:
  replicas: 2

  template:
    spec:
      containers:
        - name: manager
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: "1"
              memory: 512Mi
