# =============================================================================
# OSHA - Event Correlation Configuration
# =============================================================================
#
# Controls how normalized infrastructure events are:
#   - deduplicated
#   - grouped
#   - temporally correlated
#   - associated with resources/providers
#   - scored
#   - promoted into incidents
#
# The correlation layer should not perform remediation itself.
# =============================================================================


correlation:

  # ---------------------------------------------------------------------------
  # Global
  # ---------------------------------------------------------------------------

  enabled: true

  mode: "continuous"

  fail_closed: true

  processing_interval_seconds: 5

  maximum_events_per_batch: 1000

  require_valid_events: true

  preserve_raw_event_reference: true


  # ---------------------------------------------------------------------------
  # Correlation Window
  # ---------------------------------------------------------------------------

  window:

    enabled: true

    duration_seconds: 300

    maximum_duration_seconds: 900

    use_event_timestamp: true

    reject_future_events: true

    allowed_clock_skew_seconds: 30


  # ---------------------------------------------------------------------------
  # Event Deduplication
  # ---------------------------------------------------------------------------

  deduplication:

    enabled: true

    window_seconds: 60

    strategy: "fingerprint"

    fields:
      - "provider"
      - "resource_id"
      - "event_type"
      - "severity"
      - "source"

    ignore_timestamp_in_fingerprint: true

    update_occurrence_count: true

    preserve_first_seen: true

    update_last_seen: true


  # ---------------------------------------------------------------------------
  # Resource Correlation
  # ---------------------------------------------------------------------------

  resource_correlation:

    enabled: true

    require_resource_identity: true

    group_by_resource_id: true

    group_by_resource_type: true

    correlate_parent_child_resources: true

    allow_unknown_resources: false


  # ---------------------------------------------------------------------------
  # Provider Correlation
  # ---------------------------------------------------------------------------

  provider_correlation:

    enabled: true

    supported_providers:
      - "linux"
      - "kubernetes"
      - "openstack"
      - "ceph"
      - "minio"

    allow_cross_provider_correlation: true

    require_relationship_evidence: true


  # ---------------------------------------------------------------------------
  # Temporal Correlation
  # ---------------------------------------------------------------------------

  temporal:

    enabled: true

    maximum_gap_seconds: 120

    prefer_recent_events: true

    require_timestamp: true


  # ---------------------------------------------------------------------------
  # Event-Type Correlation
  # ---------------------------------------------------------------------------

  event_types:

    enabled: true

    group_identical_types: true

    correlate_related_types: true

    allow_unknown_types: false


  # ---------------------------------------------------------------------------
  # Severity
  # ---------------------------------------------------------------------------

  severity:

    enabled: true

    levels:
      - "info"
      - "warning"
      - "minor"
      - "major"
      - "critical"

    minimum_for_incident: "warning"

    inherit_highest_severity: true

    allow_escalation: true

    allow_automatic_deescalation: false


  # ---------------------------------------------------------------------------
  # Correlation Scoring
  # ---------------------------------------------------------------------------

  scoring:

    enabled: true

    minimum_score: 0.70

    weights:

      same_resource: 0.30

      same_provider: 0.10

      temporal_proximity: 0.20

      event_type_relationship: 0.20

      topology_relationship: 0.15

      severity_relationship: 0.05

    clamp_score:
      minimum: 0.0
      maximum: 1.0


  # ---------------------------------------------------------------------------
  # Topology-Aware Correlation
  # ---------------------------------------------------------------------------

  topology:

    enabled: true

    correlate_dependencies: true

    correlate_parent_child: true

    correlate_hosted_resources: true

    maximum_relationship_depth: 3

    require_known_relationship: true


  # ---------------------------------------------------------------------------
  # Infrastructure Relationships
  # ---------------------------------------------------------------------------

  relationships:

    enabled: true

    relationships:

      kubernetes_pod_node:
        enabled: true

      kubernetes_workload_pod:
        enabled: true

      openstack_instance_hypervisor:
        enabled: true

      openstack_instance_network:
        enabled: true

      openstack_instance_volume:
        enabled: true

      ceph_osd_host:
        enabled: true

      minio_node_storage:
        enabled: true


  # ---------------------------------------------------------------------------
  # Anomaly Integration
  # ---------------------------------------------------------------------------

  anomaly:

    enabled: true

    include_anomaly_score: true

    minimum_score: 0.80

    increase_correlation_confidence: true

    anomaly_weight: 0.15


  # ---------------------------------------------------------------------------
  # Event Classification Integration
  # ---------------------------------------------------------------------------

  classification:

    enabled: true

    require_minimum_confidence: true

    minimum_confidence: 0.80

    use_predicted_event_type: true

    use_prediction_confidence: true


  # ---------------------------------------------------------------------------
  # Incident Creation
  # ---------------------------------------------------------------------------

  incidents:

    enabled: true

    auto_create: true

    minimum_events: 2

    minimum_correlation_score: 0.70

    require_resource_context: true

    require_provider_context: true

    include_source_events: true

    include_correlation_score: true

    include_anomaly_score: true

    include_classification: true

    include_topology_context: true


  # ---------------------------------------------------------------------------
  # Existing Incident Matching
  # ---------------------------------------------------------------------------

  incident_matching:

    enabled: true

    window_seconds: 900

    match_resource: true

    match_provider: true

    match_event_type: true

    match_existing_open_incidents: true

    append_events_to_existing_incident: true

    reopen_closed_incidents: false


  # ---------------------------------------------------------------------------
  # Noise Reduction
  # ---------------------------------------------------------------------------

  noise_reduction:

    enabled: true

    suppress_duplicate_events: true

    suppress_repeated_identical_events: true

    repetition_window_seconds: 60

    suppress_low_confidence_events: true

    minimum_confidence: 0.50


  # ---------------------------------------------------------------------------
  # Flapping Detection
  # ---------------------------------------------------------------------------

  flapping:

    enabled: true

    window_seconds: 300

    transition_threshold: 5

    suppress_repeated_transitions: true

    emit_flapping_event: true


  # ---------------------------------------------------------------------------
  # Root Cause Candidates
  # ---------------------------------------------------------------------------

  root_cause:

    enabled: true

    generate_candidates: true

    maximum_candidates: 5

    consider:

      first_event: true

      highest_severity: true

      topology_dependency: true

      anomaly_score: true

      temporal_order: true

    # Correlation generates candidates only.
    # Final cause determination belongs to later reasoning/decision stages.
    mark_as_confirmed: false


  # ---------------------------------------------------------------------------
  # Correlation State
  # ---------------------------------------------------------------------------

  state:

    enabled: true

    persist: true

    directory: "./artifacts/correlation"

    restore_on_startup: true

    checkpoint_interval_seconds: 60

    maximum_age_seconds: 3600


  # ---------------------------------------------------------------------------
  # Memory Limits
  # ---------------------------------------------------------------------------

  memory:

    maximum_active_events: 50000

    maximum_active_incidents: 10000

    evict_expired_events: true

    eviction_interval_seconds: 60


  # ---------------------------------------------------------------------------
  # Retry
  # ---------------------------------------------------------------------------

  retry:

    enabled: true

    max_attempts: 3

    initial_delay_seconds: 1

    maximum_delay_seconds: 10

    exponential_backoff: true


  # ---------------------------------------------------------------------------
  # Failure Handling
  # ---------------------------------------------------------------------------

  failure:

    continue_on_event_failure: true

    isolate_invalid_events: true

    quarantine_invalid_events: true

    quarantine_directory: "./artifacts/correlation/quarantine"

    emit_failure_event: true

    fail_pipeline_on_internal_error: false


  # ---------------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------------

  observability:

    metrics:
      enabled: true

      processed_events: true

      correlated_events: true

      duplicate_events: true

      incidents_created: true

      incidents_updated: true

      correlation_latency: true

      failures: true

    logging:
      enabled: true

      log_incident_creation: true

      log_incident_update: true

      log_correlation_failure: true

      log_duplicate_suppression: false

      log_every_event: false


  # ---------------------------------------------------------------------------
  # Safety
  # ---------------------------------------------------------------------------

  safety:

    correlation_cannot_execute_actions: true

    correlation_cannot_modify_infrastructure: true

    require_validated_input: true

    reject_unknown_providers: true

    reject_invalid_scores: true