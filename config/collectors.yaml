schema_version: "1"

collectors:
  enabled: true

  defaults:
    interval_seconds: 30.0
    timeout_seconds: 10.0
    continue_on_error: true

  linux:
    enabled: true
    interval_seconds: 15.0

    signals:
      cpu: true
      memory: true
      load: true
      disk: true
      filesystem: true
      network: true
      processes: true

  kubernetes:
    enabled: false
    interval_seconds: 30.0

    collect:
      nodes: true
      pods: true
      deployments: true
      events: true

  openstack:
    enabled: false
    interval_seconds: 30.0

    collect:
      compute: true
      networking: true
      storage: true

  docker:
    enabled: false
    interval_seconds: 30.0

  logs:
    enabled: true

    sources: []

  normalization:
    enabled: true
    reject_invalid_records: true
