apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: osha-lifecycle-manager-rolebinding
  labels:
    app.kubernetes.io/name: osha-operator-lifecycle
    app.kubernetes.io/component: lifecycle-manager
    app.kubernetes.io/part-of: osha
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: osha-lifecycle-manager-role
subjects:
  - kind: ServiceAccount
    name: osha-lifecycle-manager
    namespace: osha-lifecycle-system
