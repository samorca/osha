---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: operatorpackages.lifecycle.osha.io
spec:
  group: lifecycle.osha.io
  names:
    categories:
    - osha
    kind: OperatorPackage
    listKind: OperatorPackageList
    plural: operatorpackages
    shortNames:
    - opkg
    singular: operatorpackage
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .spec.defaultChannel
      name: Default Channel
      type: string
    - jsonPath: .status.resolvedDefaultVersion
      name: Default Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OperatorPackageSpec defines an installable Operator package.
            properties:
              channels:
                items:
                  description: OperatorChannel defines one package update stream.
                  properties:
                    entries:
                      description: Entries contains releases belonging to this channel.
                      items:
                        description: ChannelEntry places a release into an update
                          stream.
                        properties:
                          replaces:
                            description: Replaces optionally defines the previous
                              version in this channel.
                            type: string
                          skips:
                            description: Skips allows explicitly bypassing listed
                              versions during resolution.
                            items:
                              type: string
                            type: array
                          version:
                            description: Version references an entry from spec.releases.
                            minLength: 1
                            type: string
                        required:
                        - version
                        type: object
                      minItems: 1
                      type: array
                    name:
                      minLength: 1
                      type: string
                  required:
                  - entries
                  - name
                  type: object
                minItems: 1
                type: array
              defaultChannel:
                description: |-
                  DefaultChannel identifies the channel used when a subscription does not
                  explicitly select one.
                minLength: 1
                type: string
              description:
                description: Description provides a human-readable package description.
                type: string
              displayName:
                description: DisplayName is the human-readable package name.
                minLength: 1
                type: string
              provider:
                description: Provider identifies the package publisher or owner.
                minLength: 1
                type: string
              releases:
                items:
                  description: OperatorRelease describes one available Operator version.
                  properties:
                    artifacts:
                      description: OperatorArtifact identifies the deployable artifacts
                        for one release.
                      properties:
                        bundleImage:
                          description: BundleImage optionally identifies an OLM-compatible
                            bundle image.
                          type: string
                        digest:
                          description: Digest optionally pins the controller image
                            to an immutable digest.
                          type: string
                        image:
                          description: Image is the controller image for this Operator
                            release.
                          minLength: 1
                          type: string
                      required:
                      - image
                      type: object
                    dependencies:
                      items:
                        description: OperatorDependency declares another Operator
                          package requirement.
                        properties:
                          package:
                            minLength: 1
                            type: string
                          versionConstraint:
                            description: |-
                              VersionConstraint is a semantic-version constraint interpreted by
                              the lifecycle resolver.
                            minLength: 1
                            type: string
                        required:
                        - package
                        - versionConstraint
                        type: object
                      type: array
                    maturity:
                      enum:
                      - Alpha
                      - Beta
                      - Stable
                      - Deprecated
                      type: string
                    providedAPIs:
                      items:
                        description: APIReference identifies a Kubernetes API provided
                          or required by an Operator.
                        properties:
                          group:
                            minLength: 1
                            type: string
                          kind:
                            minLength: 1
                            type: string
                          version:
                            minLength: 1
                            type: string
                        required:
                        - group
                        - kind
                        - version
                        type: object
                      type: array
                    publishedAt:
                      format: date-time
                      type: string
                    releaseNotes:
                      type: string
                    replaces:
                      description: |-
                        Replaces identifies the previous release when the package declares
                        an explicit sequential upgrade.
                      type: string
                    requiredAPIs:
                      items:
                        description: APIReference identifies a Kubernetes API provided
                          or required by an Operator.
                        properties:
                          group:
                            minLength: 1
                            type: string
                          kind:
                            minLength: 1
                            type: string
                          version:
                            minLength: 1
                            type: string
                        required:
                        - group
                        - kind
                        - version
                        type: object
                      type: array
                    version:
                      description: Version must contain the release version understood
                        by the resolver.
                      minLength: 1
                      type: string
                  required:
                  - artifacts
                  - maturity
                  - version
                  type: object
                minItems: 1
                type: array
            required:
            - channels
            - defaultChannel
            - displayName
            - provider
            - releases
            type: object
          status:
            description: OperatorPackageStatus contains lifecycle-manager observations
              about the package.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              resolvedDefaultVersion:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
