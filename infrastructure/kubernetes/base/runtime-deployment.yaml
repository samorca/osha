---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: osha-runtime
  namespace: osha

  labels:
    app.kubernetes.io/name: osha
    app.kubernetes.io/instance: osha
    app.kubernetes.io/component: runtime
    app.kubernetes.io/part-of: osha
    app.kubernetes.io/managed-by: kustomize

    osha.atonixcorp.io/system: orchestration-self-healing-ai

  annotations:
    osha.atonixcorp.io/description: >-
      OSHA orchestration runtime deployment.


spec:
  # -------------------------------------------------------------
  # Runtime concurrency
  # -------------------------------------------------------------
  #
  # Keep the orchestration runtime single-instance in
  # the base configuration.
  #
  # Multiple runtime replicas require explicit
  # coordination / leader-election semantics before
  # they should be enabled.
  # -------------------------------------------------------------

  replicas: 1

  revisionHistoryLimit: 5


  # -------------------------------------------------------------
  # Pod selector
  # -------------------------------------------------------------

  selector:
    matchLabels:
      app.kubernetes.io/name: osha
      app.kubernetes.io/instance: osha
      app.kubernetes.io/component: runtime


  # -------------------------------------------------------------
  # Deployment strategy
  # -------------------------------------------------------------
  #
  # Do not intentionally run two orchestration
  # runtimes during a rollout.
  #
  # Recreate is safer for the base runtime until
  # distributed coordination is explicitly
  # implemented.
  # -------------------------------------------------------------

  strategy:
    type: Recreate


  template:
    metadata:
      labels:
        app.kubernetes.io/name: osha
        app.kubernetes.io/instance: osha
        app.kubernetes.io/component: runtime
        app.kubernetes.io/part-of: osha
        app.kubernetes.io/managed-by: kustomize

        osha.atonixcorp.io/system: orchestration-self-healing-ai

      annotations:
        osha.atonixcorp.io/workload: runtime


    spec:
      # -----------------------------------------------------------
      # Kubernetes identity
      # -----------------------------------------------------------

      serviceAccountName: osha-runtime

      automountServiceAccountToken: false


      # -----------------------------------------------------------
      # Graceful shutdown
      # -----------------------------------------------------------
      #
      # This is intentionally longer than the current
      # OSHA runtime shutdown timeout of 60 seconds.
      #
      # It gives src.runtime.main time to receive
      # SIGTERM and invoke OshaRuntime.shutdown().
      # -----------------------------------------------------------

      terminationGracePeriodSeconds: 75


      # -----------------------------------------------------------
      # Pod security
      # -----------------------------------------------------------

      securityContext:
        runAsNonRoot: true

        seccompProfile:
          type: RuntimeDefault


      # -----------------------------------------------------------
      # Runtime container
      # -----------------------------------------------------------

      containers:
        - name: runtime

          #
          # Kustomize overlays will replace the image
          # for real environments.
          #
          image: osha:latest

          imagePullPolicy: IfNotPresent


          # -------------------------------------------------------
          # Runtime entrypoint
          # -------------------------------------------------------
          #
          # scripts/runtime/run.sh ultimately executes:
          #
          #     python -m src.runtime.main
          #
          # using exec so SIGTERM reaches Python.
          # -------------------------------------------------------

          command:
            - /bin/bash
            - /app/scripts/runtime/run.sh


          workingDir: /app


          # -------------------------------------------------------
          # Shared non-secret configuration
          # -------------------------------------------------------

          envFrom:
            - configMapRef:
                name: osha-config


          # -------------------------------------------------------
          # Kubernetes runtime identity
          # -------------------------------------------------------

          env:
            - name: OSHA_KUBERNETES_NAMESPACE

              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace


            - name: OSHA_POD_NAME

              valueFrom:
                fieldRef:
                  fieldPath: metadata.name


            - name: OSHA_POD_UID

              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid


            - name: OSHA_NODE_NAME

              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName


            - name: OSHA_POD_IP

              valueFrom:
                fieldRef:
                  fieldPath: status.podIP


            # Runtime ownership marker.
            - name: OSHA_STARTED_BY
              value: "kubernetes-runtime"


          # -------------------------------------------------------
          # Resources
          # -------------------------------------------------------
          #
          # These are conservative base values, not
          # performance claims.
          #
          # Environment overlays can tune them after
          # profiling the orchestration workload.
          # -------------------------------------------------------

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "2"
              memory: "2Gi"


          # -------------------------------------------------------
          # Container security
          # -------------------------------------------------------

          securityContext:
            allowPrivilegeEscalation: false

            privileged: false

            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL


          # -------------------------------------------------------
          # Writable paths
          # -------------------------------------------------------
          #
          # Root filesystem remains read-only.
          #
          # Runtime-state/output locations that need
          # persistent storage will get explicit PVCs
          # later rather than making the entire root
          # filesystem writable.
          # -------------------------------------------------------

          volumeMounts:
            - name: tmp
              mountPath: /tmp

            - name: runtime-tmp
              mountPath: /app/.runtime

            - name: runtime-artifacts
              mountPath: /app/artifacts/runtime


      # -------------------------------------------------------------
      # Volumes
      # -------------------------------------------------------------

      volumes:
        - name: tmp
          emptyDir: {}

        - name: runtime-tmp
          emptyDir: {}

        - name: runtime-artifacts
          emptyDir: {}
