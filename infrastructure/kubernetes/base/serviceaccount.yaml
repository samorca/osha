---
apiVersion: v1
kind: ServiceAccount

metadata:
  name: osha-api
  namespace: osha

  labels:
    app.kubernetes.io/name: osha
    app.kubernetes.io/instance: osha
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: osha
    app.kubernetes.io/managed-by: kustomize

    osha.atonixcorp.io/system: orchestration-self-healing-ai

  annotations:
    osha.atonixcorp.io/description: >-
      Kubernetes identity for the OSHA API workload.

#
# The API currently does not need direct Kubernetes
# API credentials merely to serve HTTP requests.
#
automountServiceAccountToken: false


---
apiVersion: v1
kind: ServiceAccount

metadata:
  name: osha-runtime
  namespace: osha

  labels:
    app.kubernetes.io/name: osha
    app.kubernetes.io/instance: osha
    app.kubernetes.io/component: runtime
    app.kubernetes.io/part-of: osha
    app.kubernetes.io/managed-by: kustomize

    osha.atonixcorp.io/system: orchestration-self-healing-ai

  annotations:
    osha.atonixcorp.io/description: >-
      Kubernetes identity for the OSHA orchestration
      runtime workload.

#
# Keep Kubernetes API credential mounting disabled in
# the base deployment.
#
# If a future runtime integration genuinely requires
# Kubernetes API access, enable it explicitly together
# with narrowly scoped RBAC rather than granting
# cluster access here by default.
#
automountServiceAccountToken: false


---
apiVersion: v1
kind: ServiceAccount

metadata:
  name: osha-worker
  namespace: osha

  labels:
    app.kubernetes.io/name: osha
    app.kubernetes.io/instance: osha
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: osha
    app.kubernetes.io/managed-by: kustomize

    osha.atonixcorp.io/system: orchestration-self-healing-ai

  annotations:
    osha.atonixcorp.io/description: >-
      Kubernetes identity for OSHA worker workloads.

#
# Workers also start without Kubernetes API
# credentials.
#
# Worker-specific access should be introduced
# explicitly if a worker needs Kubernetes access.
#
automountServiceAccountToken: false
