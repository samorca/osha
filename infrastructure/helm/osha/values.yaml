---
# ================================================================
# OSHA Helm defaults
# ================================================================


# ----------------------------------------------------------------
# Global
# ----------------------------------------------------------------

global:
  environment: kubernetes

  dryRun: true

  image:
    repository: osha
    tag: latest
    pullPolicy: IfNotPresent

  imagePullSecrets: []


# ----------------------------------------------------------------
# Shared OSHA runtime configuration
# ----------------------------------------------------------------

config:
  environmentId: kubernetes

  instanceName: osha

  failFast: true

  startupTimeoutSeconds: 60

  shutdownTimeoutSeconds: 60

  healthIntervalSeconds: 15

  runtimeLogLevel: info


# ----------------------------------------------------------------
# Remediation safety
# ----------------------------------------------------------------

remediation:
  enabled: true

  dryRun: true

  automaticExecution: false

  requireApproval: true

  allowDestructiveActions: false


# ----------------------------------------------------------------
# API
# ----------------------------------------------------------------

api:
  enabled: true

  replicaCount: 1

  workers: 1

  host: "0.0.0.0"

  port: 8000

  logLevel: info

  gracefulTimeoutSeconds: 30

  limitConcurrency: 500

  limitMaxRequests: 10000

  forwardedAllowIPs: "127.0.0.1"


  service:
    type: ClusterIP

    port: 8000


  resources:
    requests:
      cpu: 250m
      memory: 256Mi

    limits:
      cpu: "2"
      memory: 2Gi


  startupProbe:
    enabled: true

    path: /health/live

    periodSeconds: 5

    timeoutSeconds: 3

    failureThreshold: 24


  livenessProbe:
    enabled: true

    path: /health/live

    periodSeconds: 15

    timeoutSeconds: 3

    failureThreshold: 3


  readinessProbe:
    enabled: true

    path: /health/ready

    periodSeconds: 10

    timeoutSeconds: 3

    failureThreshold: 3


# ----------------------------------------------------------------
# Runtime
# ----------------------------------------------------------------

runtime:
  enabled: true

  #
  # Keep the orchestration authority single-instance
  # until distributed coordination / leader election
  # is explicitly implemented.
  #
  replicaCount: 1

  startedBy: helm-runtime

  resources:
    requests:
      cpu: 250m
      memory: 256Mi

    limits:
      cpu: "2"
      memory: 2Gi


# ----------------------------------------------------------------
# Workers
# ----------------------------------------------------------------

worker:
  enabled: true

  replicaCount: 1

  type: telemetry

  concurrency: 1

  pollIntervalSeconds: 2

  gracefulShutdownSeconds: 30

  resources:
    requests:
      cpu: 250m
      memory: 256Mi

    limits:
      cpu: "2"
      memory: 2Gi


# ----------------------------------------------------------------
# Telemetry
# ----------------------------------------------------------------

telemetry:
  enabled: true

  intervalSeconds: 15


# ----------------------------------------------------------------
# Collectors
# ----------------------------------------------------------------

collectors:
  enabled: true

  intervalSeconds: 30


# ----------------------------------------------------------------
# Accelerator
# ----------------------------------------------------------------

accelerator:
  preferred: auto

  allowCPUFallback: true


# ----------------------------------------------------------------
# Storage paths
# ----------------------------------------------------------------
#
# These are container filesystem locations.
#
# Persistence is deliberately controlled separately
# rather than implied by these path definitions.
# ----------------------------------------------------------------

paths:
  artifacts: /app/artifacts

  checkpoints: /app/checkpoints

  models: /app/models

  logs: /app/logs

  data: /app/orchestration-ai-data


# ----------------------------------------------------------------
# Persistence
# ----------------------------------------------------------------
#
# Disabled in the base chart until storage classes
# and ownership requirements are selected for each
# environment.
# ----------------------------------------------------------------

persistence:
  enabled: false

  storageClass: ""

  accessModes:
    - ReadWriteOnce

  size: 10Gi


# ----------------------------------------------------------------
# Service accounts
# ----------------------------------------------------------------

serviceAccount:
  api:
    create: true

    name: osha-api

    automountServiceAccountToken: false


  runtime:
    create: true

    name: osha-runtime

    automountServiceAccountToken: false


  worker:
    create: true

    name: osha-worker

    automountServiceAccountToken: false


# ----------------------------------------------------------------
# Pod security
# ----------------------------------------------------------------

podSecurityContext:
  runAsNonRoot: true

  seccompProfile:
    type: RuntimeDefault


securityContext:
  allowPrivilegeEscalation: false

  privileged: false

  readOnlyRootFilesystem: true

  capabilities:
    drop:
      - ALL


# ----------------------------------------------------------------
# Scheduling
# ----------------------------------------------------------------

nodeSelector: {}

tolerations: []

affinity: {}


# ----------------------------------------------------------------
# Additional labels
# ----------------------------------------------------------------

commonLabels: {}


# ----------------------------------------------------------------
# Additional annotations
# ----------------------------------------------------------------

podAnnotations: {}
