{{/*
=====================================================================
OSHA ServiceAccounts
=====================================================================

Separate Kubernetes identities are maintained for:

    API
    Runtime
    Worker

This allows RBAC to evolve independently for each
workload.

The base chart does not grant Kubernetes API
permissions to any of these ServiceAccounts.
*/}}


{{/*
=====================================================================
API ServiceAccount
=====================================================================
*/}}

{{- if and .Values.api.enabled .Values.serviceAccount.api.create }}
---
apiVersion: v1
kind: ServiceAccount

metadata:
  name: {{ include "osha.api.serviceAccountName" . }}
  namespace: {{ include "osha.namespace" . }}

  labels:
    {{- include "osha.api.labels" . | nindent 4 }}

  annotations:
    osha.atonixcorp.io/description: >-
      Kubernetes identity for the OSHA API workload.

automountServiceAccountToken: {{ .Values.serviceAccount.api.automountServiceAccountToken }}
{{- end }}


{{/*
=====================================================================
Runtime ServiceAccount
=====================================================================
*/}}

{{- if and .Values.runtime.enabled .Values.serviceAccount.runtime.create }}
---
apiVersion: v1
kind: ServiceAccount

metadata:
  name: {{ include "osha.runtime.serviceAccountName" . }}
  namespace: {{ include "osha.namespace" . }}

  labels:
    {{- include "osha.runtime.labels" . | nindent 4 }}

  annotations:
    osha.atonixcorp.io/description: >-
      Kubernetes identity for the OSHA orchestration
      runtime workload.

automountServiceAccountToken: {{ .Values.serviceAccount.runtime.automountServiceAccountToken }}
{{- end }}


{{/*
=====================================================================
Worker ServiceAccount
=====================================================================
*/}}

{{- if and .Values.worker.enabled .Values.serviceAccount.worker.create }}
---
apiVersion: v1
kind: ServiceAccount

metadata:
  name: {{ include "osha.worker.serviceAccountName" . }}
  namespace: {{ include "osha.namespace" . }}

  labels:
    {{- include "osha.worker.labels" . | nindent 4 }}

  annotations:
    osha.atonixcorp.io/description: >-
      Kubernetes identity for OSHA worker workloads.

automountServiceAccountToken: {{ .Values.serviceAccount.worker.automountServiceAccountToken }}
{{- end }}
