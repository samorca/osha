apiVersion: apps/v1
kind: Deployment
metadata:
  name: osha-worker
  labels:
    app: osha-worker
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: osha-worker
  template:
    metadata:
      labels:
        app: osha-worker
        component: worker
    spec:
      restartPolicy: Always
      containers:
        - name: worker
          image: osha:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - src.workers.worker
          env:
            - name: OSHA_ENV
              value: production
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONPATH
              value: /app
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import sys; sys.exit(0)"
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import sys; sys.exit(0)"
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
