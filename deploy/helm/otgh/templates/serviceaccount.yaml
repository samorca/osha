{{/*
OTGH ServiceAccount.

This resource is created only when:

  serviceAccount.create: true

When creation is disabled, deployment.yaml uses the ServiceAccount returned by:

  otgh.serviceAccountName

This allows platform administrators to provide an externally managed
ServiceAccount when required.
*/}}

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount

metadata:
  name: {{ include "otgh.serviceAccountName" . }}
  namespace: {{ include "otgh.namespace" . }}

  labels:
    {{- include "otgh.labels" . | nindent 4 }}

  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
