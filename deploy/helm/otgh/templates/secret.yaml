{{/*
OTGH application Secret.

The chart creates this Secret only when:

  secrets.create: true

AND:

  secrets.existingSecret: ""

For production, prefer an externally managed Secret and configure:

  secrets:
    create: false
    existingSecret: otgh-secrets

Never commit real production credentials into values.yaml,
values-production.yaml, or this template.
*/}}

{{- if eq (include "otgh.createSecret" .) "true" }}
apiVersion: v1
kind: Secret

metadata:
  name: {{ include "otgh.secretName" . }}
  namespace: {{ include "otgh.namespace" . }}

  labels:
    {{- include "otgh.labels" . | nindent 4 }}

  {{- with .Values.secrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

type: Opaque

stringData:

  OTGH_INGEST_TOKEN: {{ .Values.secrets.values.ingestToken | default "" | quote }}

  OTGH_OSHA_TOKEN: {{ .Values.secrets.values.oshaToken | default "" | quote }}

  # --------------------------------------------------------------------------
  # HTTP exporter
  # --------------------------------------------------------------------------

  OTGH_HTTP_BEARER_TOKEN: {{ .Values.secrets.values.httpBearerToken | default "" | quote }}

  OTGH_HTTP_API_KEY: {{ .Values.secrets.values.httpAPIKey | default "" | quote }}

  OTGH_HTTP_BASIC_USERNAME: {{ .Values.secrets.values.httpBasicUsername | default "" | quote }}

  OTGH_HTTP_BASIC_PASSWORD: {{ .Values.secrets.values.httpBasicPassword | default "" | quote }}


  # --------------------------------------------------------------------------
  # gRPC exporter
  # --------------------------------------------------------------------------

  OTGH_GRPC_BEARER_TOKEN: {{ .Values.secrets.values.grpcBearerToken | default "" | quote }}

  OTGH_GRPC_API_KEY: {{ .Values.secrets.values.grpcAPIKey | default "" | quote }}


  # --------------------------------------------------------------------------
  # S3-compatible object storage
  #
  # The AWS SDK for Go v2 can consume these standard environment credential
  # names when its normal environment/default credential provider is used.
  # --------------------------------------------------------------------------

  AWS_ACCESS_KEY_ID: {{ .Values.secrets.values.awsAccessKeyID | default "" | quote }}

  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.values.awsSecretAccessKey | default "" | quote }}

  AWS_SESSION_TOKEN: {{ .Values.secrets.values.awsSessionToken | default "" | quote }}


  # --------------------------------------------------------------------------
  # Webhook exporter authentication
  # --------------------------------------------------------------------------

  OTGH_WEBHOOK_BEARER_TOKEN: {{ .Values.secrets.values.webhookBearerToken | default "" | quote }}

  OTGH_WEBHOOK_BASIC_USERNAME: {{ .Values.secrets.values.webhookBasicUsername | default "" | quote }}

  OTGH_WEBHOOK_BASIC_PASSWORD: {{ .Values.secrets.values.webhookBasicPassword | default "" | quote }}


  # --------------------------------------------------------------------------
  # Webhook HMAC credentials
  # --------------------------------------------------------------------------

  OTGH_WEBHOOK_SIGNING_SECRET: {{ .Values.secrets.values.webhookSigningSecret | default "" | quote }}

  OTGH_WEBHOOK_SIGNING_KEY_ID: {{ .Values.secrets.values.webhookSigningKeyID | default "" | quote }}


  # --------------------------------------------------------------------------
  # Object-store KMS
  # --------------------------------------------------------------------------

  OTGH_OBJECTSTORE_KMS_KEY_ID: {{ .Values.secrets.values.kmsKeyID | default "" | quote }}

{{- end }}
