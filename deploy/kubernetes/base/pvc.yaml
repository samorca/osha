apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: otgh-spool
  namespace: otgh

  labels:
    app.kubernetes.io/name: otgh
    app.kubernetes.io/part-of: osha
    app.kubernetes.io/component: transporter
    app.kubernetes.io/managed-by: kustomize

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 20Gi
