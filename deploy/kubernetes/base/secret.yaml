apiVersion: v1
kind: Secret

metadata:
  name: otgh-secrets
  namespace: otgh

  labels:
    app.kubernetes.io/name: otgh
    app.kubernetes.io/part-of: osha
    app.kubernetes.io/component: transporter
    app.kubernetes.io/managed-by: kustomize

type: Opaque

stringData:

  OTGH_INGEST_TOKEN: ""
  OTGH_OSHA_TOKEN: ""

  # --------------------------------------------------------------------------
  # HTTP exporter credentials
  # --------------------------------------------------------------------------
  #
  # Replace through your deployment secret-management process.
  #
  OTGH_HTTP_BEARER_TOKEN: ""
  OTGH_HTTP_API_KEY: ""
  OTGH_HTTP_BASIC_USERNAME: ""
  OTGH_HTTP_BASIC_PASSWORD: ""

  # --------------------------------------------------------------------------
  # gRPC exporter credentials
  # --------------------------------------------------------------------------

  OTGH_GRPC_BEARER_TOKEN: ""
  OTGH_GRPC_API_KEY: ""

  # --------------------------------------------------------------------------
  # Object-store credentials
  # --------------------------------------------------------------------------
  #
  # These names intentionally follow the commonly recognized AWS SDK
  # environment convention because our current S3-compatible exporter uses
  # the AWS SDK for Go v2.
  #
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_SESSION_TOKEN: ""

  # --------------------------------------------------------------------------
  # Webhook credentials
  # --------------------------------------------------------------------------

  OTGH_WEBHOOK_BEARER_TOKEN: ""
  OTGH_WEBHOOK_BASIC_USERNAME: ""
  OTGH_WEBHOOK_BASIC_PASSWORD: ""

  # HMAC signing secret.
  #
  # Production deployments should use a strong independently generated
  # secret and should not commit the real value to this manifest.
  OTGH_WEBHOOK_SIGNING_SECRET: ""

  # Identifies the active webhook signing key and enables controlled
  # key rotation.
  OTGH_WEBHOOK_SIGNING_KEY_ID: ""

  # --------------------------------------------------------------------------
  # Optional KMS configuration
  # --------------------------------------------------------------------------

  OTGH_OBJECTSTORE_KMS_KEY_ID: ""
