apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/environment: development

    includeSelectors: false

images:
  - name: otgh
    newName: otgh
    newTag: dev

patches:
  - path: deployment-patch.yaml
  - path: configmap-patch.yaml
