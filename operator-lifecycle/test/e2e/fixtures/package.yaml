apiVersion: lifecycle.osha.io/v1alpha1
kind: OperatorPackage
metadata:
  name: e2e-operator
  namespace: osha-lifecycle-system
spec:
  displayName: E2E Operator
  provider: OSHA
  description: Test package for lifecycle E2E validation.
  defaultChannel: stable

  channels:
    - name: stable
      entries:
        - version: 1.0.0
        - version: 1.1.0
          replaces: 1.0.0

  releases:
    - version: 1.0.0
      maturity: Stable
      artifacts:
        image: example.invalid/e2e-operator:1.0.0

    - version: 1.1.0
      maturity: Stable
      artifacts:
        image: example.invalid/e2e-operator:1.1.0
      replaces: 1.0.0
