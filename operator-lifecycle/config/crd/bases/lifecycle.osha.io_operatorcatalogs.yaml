  name: operatorcatalogs.lifecycle.osha.io
spec:
  group: lifecycle.osha.io
  names:
    categories:
    - osha
    kind: OperatorCatalog
    listKind: OperatorCatalogList
    plural: operatorcatalogs
    shortNames:
    - ocat
    singular: operatorcatalog
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source.type
