      type: string
    - jsonPath: .status.packageCount
      name: Packages
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              displayName:
                description: DisplayName is the human-readable catalog name.
                minLength: 1
                type: string
              enabled:
                default: true
                description: Enabled controls whether the resolver may select packages
                  from this catalog.
                type: boolean
              priority:
                default: 0
                description: |-
                  Priority allows the resolver to prefer one catalog over another.
                  Higher values represent stronger preference.
                format: int32
                maximum: 1000
                minimum: -1000
                type: integer
              publisher:
                description: Publisher identifies the organization responsible for
