                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              packageCount:
                description: |-
                  PackageCount reports the number of packages indexed from the latest
                  successful catalog synchronization.
                format: int32
                type: integer
              phase:
                enum:
                - Ready
                - Syncing
                - Degraded
                - Unavailable
