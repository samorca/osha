                minLength: 1
                type: string
              source:
                properties:
                  configMap:
                    properties:
                      key:
                        default: catalog.yaml
                        description: Key identifies the ConfigMap data key containing
                          catalog metadata.
                        type: string
                      name:
                        description: Name identifies the ConfigMap containing catalog
                          metadata.
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace defaults to the OperatorCatalog namespace.
