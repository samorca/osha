apiVersion: v1
kind: Service
metadata:
  name: otgh
  namespace: otgh
  labels:
    app.kubernetes.io/name: otgh
    app.kubernetes.io/part-of: osha
    app.kubernetes.io/component: transporter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otgh
    app.kubernetes.io/component: transporter
  ports:
    - name: ingest
      port: 8082
      targetPort: ingest
      protocol: TCP