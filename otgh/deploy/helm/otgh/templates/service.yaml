apiVersion: v1
kind: Service
metadata:
  name: {{ include "otgh.fullname" . }}
  namespace: {{ include "otgh.namespace" . }}
  labels:
    {{- include "otgh.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "otgh.selectorLabels" . | nindent 4 }}
  ports:
    - name: ingest
      port: {{ .Values.service.port }}
      targetPort: ingest
      protocol: TCP